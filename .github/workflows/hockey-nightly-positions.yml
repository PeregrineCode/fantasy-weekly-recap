name: Hockey Nightly Roster Position Capture

on:
  schedule:
    # Hockey lineups lock per player at puck drop; the latest West Coast games
    # start ~10:30pm ET. Capture after that and before Yahoo's ~3am ET
    # fantasy-day rollover. The season spans EDT and EST, so every slot below
    # lands inside that window under both offsets. As with baseball, GitHub
    # delays scheduled runs by hours, so fire several times;
    # daily-positions.js keeps the first trusted capture and refuses a
    # post-rollover one.
    - cron: '7 4 * * *'    # 12:07am EDT / 11:07pm EST
    - cron: '47 4 * * *'   # 12:47am EDT / 11:47pm EST
    - cron: '43 5 * * *'   # 1:43am EDT / 12:43am EST
    - cron: '31 6 * * *'   # 2:31am EDT / 1:31am EST
  workflow_dispatch: # Allow manual trigger

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Write Yahoo token
        run: echo '${{ secrets.YAHOO_TOKEN_JSON }}' > .yahoo-token.json

      - name: Write .env
        run: |
          echo "YAHOO_CLIENT_ID=${{ secrets.YAHOO_CLIENT_ID }}" >> .env
          echo "YAHOO_CLIENT_SECRET=${{ secrets.YAHOO_CLIENT_SECRET }}" >> .env

      - name: Capture roster positions
        run: node daily-positions.js --league hockey

      - name: Update Yahoo token secret if refreshed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -f .yahoo-token.json ]; then
            gh secret set YAHOO_TOKEN_JSON < .yahoo-token.json
            echo "Updated YAHOO_TOKEN_JSON secret"
          fi

      - name: Commit position data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f leagues/hockey/snapshots/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Hockey nightly positions: $(TZ=America/New_York date -d '3 hours ago' +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
