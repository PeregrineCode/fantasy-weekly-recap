name: Hockey Daily Stats Collection

on:
  schedule:
    # 7:23am EDT / 6:23am EST. Collects finalized stats for yesterday (late
    # West Coast games end by ~1am ET) and merges positions from the nightly
    # capture for bench detection.
    - cron: '23 11 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Write Yahoo token
        run: echo '${{ secrets.YAHOO_TOKEN_JSON }}' > .yahoo-token.json

      - name: Write .env
        run: |
          echo "YAHOO_CLIENT_ID=${{ secrets.YAHOO_CLIENT_ID }}" >> .env
          echo "YAHOO_CLIENT_SECRET=${{ secrets.YAHOO_CLIENT_SECRET }}" >> .env

      - name: Run daily collect
        run: node daily-collect.js --league hockey

      - name: Update Yahoo token secret if refreshed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -f .yahoo-token.json ]; then
            gh secret set YAHOO_TOKEN_JSON < .yahoo-token.json
            echo "Updated YAHOO_TOKEN_JSON secret"
          fi

      - name: Commit snapshot data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f leagues/hockey/snapshots/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Hockey daily collect: $(TZ=America/New_York date -d yesterday +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
