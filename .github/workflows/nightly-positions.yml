name: Nightly Roster Position Capture

on:
  schedule:
    # Target: 10:30pm ET (02:30 UTC during EDT) every day of the MLB season.
    # The latest West Coast game starts before 10:30pm ET, so all lineups are
    # locked by then and positions reflect the actual game-day roster.
    #
    # GitHub delays scheduled runs by hours (5h+ observed in Sept 2026), and a
    # run that slips past Yahoo's ~3am ET fantasy-day rollover captures the NEXT
    # day's unset roster instead. So we fire several times inside the locked
    # window (10:30pm–2:59am ET). daily-positions.js skips once a trusted
    # capture exists for the day and refuses to write a post-rollover one, so
    # extra firings cost one API call and produce no commit. Odd minutes avoid
    # the top-of-hour pileup that makes delays worst.
    - cron: '30 2 * * *'   # 10:30pm ET
    - cron: '17 3 * * *'   # 11:17pm ET
    - cron: '43 4 * * *'   # 12:43am ET
    - cron: '51 5 * * *'   # 1:51am ET
  workflow_dispatch: # Allow manual trigger

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Write Yahoo token
        run: echo '${{ secrets.YAHOO_TOKEN_JSON }}' > .yahoo-token.json

      - name: Write .env
        run: |
          echo "YAHOO_CLIENT_ID=${{ secrets.YAHOO_CLIENT_ID }}" >> .env
          echo "YAHOO_CLIENT_SECRET=${{ secrets.YAHOO_CLIENT_SECRET }}" >> .env
          echo "YAHOO_MLB_LEAGUE_ID=${{ secrets.YAHOO_MLB_LEAGUE_ID }}" >> .env

      - name: Capture roster positions
        run: node daily-positions.js

      - name: Update Yahoo token secret if refreshed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -f .yahoo-token.json ]; then
            gh secret set YAHOO_TOKEN_JSON < .yahoo-token.json
            echo "Updated YAHOO_TOKEN_JSON secret"
          fi

      - name: Commit position data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f snapshots/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Nightly positions: $(TZ=America/New_York date +%Y-%m-%d)"
            git push
          fi
